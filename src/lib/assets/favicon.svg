<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- pot -->
  <rect x="9" y="21" width="14" height="9" rx="1" fill="#cf6a3a"/>
  <rect x="7" y="19" width="18" height="4" rx="1" fill="#b85a2a"/>
  <!-- soil -->
  <rect x="9" y="20" width="14" height="3" fill="#6e5040"/>

  <!-- stem -->
  <rect x="15" y="11" width="2" height="10" fill="#5a7a3a"/>

  <!-- left leaf -->
  <ellipse cx="11" cy="13" rx="4" ry="2.5" fill="#7c8a52" transform="rotate(-30 11 13)"/>
  <!-- right leaf -->
  <ellipse cx="21" cy="11" rx="4" ry="2.5" fill="#7c8a52" transform="rotate(30 21 11)"/>
  <!-- top leaf -->
  <ellipse cx="16" cy="8" rx="3" ry="4.5" fill="#8fa05e" transform="rotate(-5 16 8)"/>

  <!-- pixel highlight dots on leaves -->
  <rect x="14" y="5" width="1" height="1" fill="#b0c07a"/>
  <rect x="10" y="12" width="1" height="1" fill="#b0c07a"/>
  <rect x="20" y="10" width="1" height="1" fill="#b0c07a"/>
</svg>
